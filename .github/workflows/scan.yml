name: Daily Procurement Job Scan

on:
  # Paused: scheduled weekday scans are disabled.
  # To resume, restore the cron below:
  # schedule:
  #   # 07:00 UTC = 09:00 Latvia (EET) / 10:00 Latvia (EEST summer)
  #   # Runs Mon-Fri only
  #   - cron: '0 7 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

permissions:
  contents: write      # needed to commit seen_jobs.json back

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: vpoborcevs@gmail.com
        run: python scanner.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name  "job-scanner[bot]"
          git config user.email "job-scanner[bot]@users.noreply.github.com"
          git add seen_jobs.json jobs.json dismissed.json
          git diff --staged --quiet || git commit -m "chore: update jobs [skip ci]"
          git push
